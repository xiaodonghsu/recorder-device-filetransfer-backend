[project]
name = "recorder-device-filetransfer-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "python-dotenv>=1.0.1",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.12",
    "uvicorn[standard]>=0.32.0",
    # 华为云 OBS 官方 SDK（STORAGE_BACKEND=obs）
    "esdk-obs-python>=3.24.0",
    # 上传文件元数据数据库（SQLite / MySQL）
    "sqlalchemy>=2.0.30",
    "pymysql>=1.1.1",
]
